name: CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-cpu.txt
      - run: OMP_NUM_THREADS=1 python -m kernels cpu
